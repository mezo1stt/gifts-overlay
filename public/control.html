<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>
<link rel="stylesheet" href="/control.css">
</head>
<body>
<h1>🎛️ لوحة تحكم الهدايا</h1>

<div class="overlay-link-box">
    <p>📺 <strong>رابط الـ Overlay (لـ TikTok Live Studio / OBS):</strong></p>
    <div class="link-row">
        <input type="text" id="overlayUrl" readonly>
        <button onclick="copyOverlayUrl()">📋 نسخ</button>
    </div>
</div>

<div class="color-box">
    <p>🎨 <strong>لون النيون:</strong></p>
    <div class="color-row">
        <input type="color" id="neonColor" value="#a855f7">
        <span id="colorValue">#a855f7</span>
        <button onclick="saveColor()">💾 حفظ اللون</button>
    </div>
    <div class="color-presets">
        <button class="preset" data-color="#a855f7" style="background:#a855f7" title="بنفسجي"></button>
        <button class="preset" data-color="#3b82f6" style="background:#3b82f6" title="أزرق"></button>
        <button class="preset" data-color="#10b981" style="background:#10b981" title="أخضر"></button>
        <button class="preset" data-color="#ef4444" style="background:#ef4444" title="أحمر"></button>
        <button class="preset" data-color="#f59e0b" style="background:#f59e0b" title="برتقالي"></button>
        <button class="preset" data-color="#ec4899" style="background:#ec4899" title="وردي"></button>
        <button class="preset" data-color="#06b6d4" style="background:#06b6d4" title="سماوي"></button>
        <button class="preset" data-color="#facc15" style="background:#facc15" title="أصفر"></button>
    </div>
</div>

<div class="upload-box">
    <h3>📤 اختر الصور</h3>
    <p class="upload-hint">اضغط الزر لاختيار صورة أو أكثر من جهازك</p>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button class="choose-btn" onclick="document.getElementById('fileInput').click()">
        📁 اختيار الصور
    </button>
</div>

<div id="previewBox" class="preview-box"></div>

<button id="saveAllBtn" class="save-all-btn" style="display:none" onclick="saveAllGifts()">
    💾 حفظ كل الصور
</button>

<h2 class="section-title">📋 الهدايا الحالية</h2>
<div id="list" class="list"></div>

<script src="/control.js"></script>
</body>
</html>
